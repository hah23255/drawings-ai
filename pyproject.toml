[project]
name = "construction-drawings-ai"
version = "1.0.0"
description = "Production-grade relational database and technical wiki indexing pipeline for 2D CAD/PDF construction drawings"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Hristo Hristov", email = "hristo.hristov@ccvs.tech" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.0.0",
    "pymupdf>=1.22.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "pillow>=9.0.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawings_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
